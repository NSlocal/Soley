name: Soley-Browser Build (Cached Fast)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set Build Name
        run: |
          echo "APK_NAME=Soley-Browser-unsigned-${GITHUB_SHA::7}.apk" >> $GITHUB_ENV

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl unzip lsb-release

      - name: Get Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          gclient --version

      # ✅ CACHE — SUMBER DISIMPAN! TIDAK DOWNLOAD ULANG!
      - name: Restore Chromium Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/chromium
          key: chromium-cache-${{ hashFiles('args.gn') }}
          restore-keys: |
            chromium-cache-

      - name: Fetch Chromium Source
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          mkdir -p ~/chromium && cd ~/chromium
          # --with-git-cache = cepat jika cache sudah ada
          if [ ! -d "src" ]; then
            fetch --nohooks --with-git-cache android
          else
            echo "✅ Cache dipakai — skip download penuh!"
          fi

      - name: Run Gclient Hooks
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          gclient runhooks

      - name: Config & Generate
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          cp $GITHUB_WORKSPACE/args.gn ./
          gn gen out/Release --args="$(cat args.gn)"

      - name: Build APK
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          autoninja -C out/Release chrome_public_apk

      - name: Prepare APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk_out
          cp ~/chromium/src/out/Release/apks/*.apk $GITHUB_WORKSPACE/apk_out/ 2>/dev/null || \
          cp ~/chromium/src/out/Release/*.apk $GITHUB_WORKSPACE/apk_out/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/apk_out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soley-Browser-APK
          path: apk_out/*.apk
