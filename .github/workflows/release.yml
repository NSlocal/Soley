name: Soley-Browser Build & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Set Build Env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APK_NAME=Soley-Browser-arm64-v8a-signed-${GITHUB_REF#refs/tags/}.apk" >> $GITHUB_ENV
          else
            echo "APK_NAME=Soley-Browser-arm64-v8a-signed-dev-${GITHUB_SHA::7}.apk" >> $GITHUB_ENV
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl unzip lsb-release ca-certificates

      - name: Get Depot Tools & Auto-Initialize
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          # ✅ Auto-bootstrap by running gclient once
          gclient --version

      - name: Fetch Chromium Android Source
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          mkdir -p ~/chromium && cd ~/chromium
          fetch --nohooks android

      - name: Run Gclient Hooks
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          gclient runhooks

      - name: Apply Build Config & Generate
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          cp $GITHUB_WORKSPACE/args.gn ./
          gn gen out/Release --args="$(cat args.gn)"

      - name: Build Browser APK
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          cd ~/chromium/src
          autoninja -C out/Release chrome_public_apk

      - name: Prepare APK for Signing
        run: |
          mkdir -p $GITHUB_WORKSPACE/apk_out
          cp ~/chromium/src/out/Release/apks/*.apk $GITHUB_WORKSPACE/apk_out/ 2>/dev/null || \
          cp ~/chromium/src/out/Release/*.apk $GITHUB_WORKSPACE/apk_out/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/apk_out/

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: apk_out
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apk_out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
