name: Soley-Browser Build & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240  # Chromium takes time!

    steps:
      - uses: actions/checkout@v4

      - name: Set Build Env
        run: |
          echo "APK_NAME=Soley-Browser-arm64-v8a-signed-v${GITHUB_REF_NAME#v}.apk" >> $GITHUB_ENV

      # === DEPENDENCIES & CHROMIUM CHECKOUT ===
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip curl unzip lsb-release
          pip3 install depot_tools

      - name: Fetch Chromium Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"

      - name: Pull Chromium Source (ARM64 Android)
        run: |
          mkdir -p ~/chromium && cd ~/chromium
          fetch --nohooks android
          cd src
          git checkout main
          gclient runhooks

      - name: Apply Our Build Config
        run: |
          cd ~/chromium/src
          cp $GITHUB_WORKSPACE/args.gn ./
          gn gen out/Release --args="$(cat args.gn)"

      - name: Build Browser
        run: |
          cd ~/chromium/src
          autoninja -C out/Release chrome_public_apk

      - name: Locate Built APK
        run: |
          find ~/chromium/src/out/Release -name "*.apk" -type f
          mkdir -p $GITHUB_WORKSPACE/apk_out
          cp ~/chromium/src/out/Release/apks/*.apk $GITHUB_WORKSPACE/apk_out/ || true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: apk_out
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apk_out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
